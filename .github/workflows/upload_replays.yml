name: Upload LoL Replays

on:
  schedule:
    # Off-hour minutes on purpose: GitHub documents that schedule events are
    # delayed/dropped under load and that "high load times include the start
    # of every hour" -- */30 hit :00 and :30 exactly. Measured 2026-08-26..09-01:
    # cron fired 30/day until 26-Aug, then 2-6/day. The 30-min cadence today
    # comes from an external workflow_dispatch trigger; this cron is the backup.
    # 2026-09-02: 13,43 did not recover the cadence (7 runs/day). Six off-hour
    # slots per hour: if GitHub drops schedule events individually, more slots
    # survive; the concurrency group serializes any that overlap.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # necesario para commit automático

# Solo una corrida a la vez: el cron y los workflow_dispatch cada 30 min pueden
# solaparse (cada run tarda ~13 min) y el segundo push de index.json era
# rechazado (non-fast-forward). Con esto las corridas se encolan.
concurrency:
  group: upload-replays
  cancel-in-progress: false

jobs:
  upload_replays:
    runs-on: ubuntu-latest
    

    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}  # <-- usar token OAuth real
      # GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Ensure replays folder exists
        run: mkdir -p replays

      - name: Download new replays
        run: python scripts/download_replay.py

      - name: Upload replays to Drive
        run: python scripts/upload_replay.py

      # NOTE: upload_replay.py never touches index.json (only reads/writes
      # replays/ and uploaded_temp.json, both untracked/gitignored), so the
      # tree is still clean here. Rebasing now -- before index.json is
      # modified -- means this pull can never itself conflict on index.json.
      - name: Rebase onto latest main before updating index.json
        run: git pull --rebase origin main

      - name: Update index.json
        run: python scripts/update_index.py

      # Replaces stefanzweifel/git-auto-commit-action: that action's commit
      # landed *after* the plain "git pull --rebase --autostash" step above,
      # so when origin's index.json had moved, the autostash pop conflicted
      # silently (exit 0) and the follow-up commit failed with "you need to
      # resolve your current index first". Now we commit+push ourselves with
      # a retry loop: on a rejected push we rebase onto main again, and if
      # that rebase conflicts on index.json we union both versions by
      # drive_file_id instead of dropping either side's uploads.
      - name: Commit and push index.json
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add index.json
          # expired_replays.json may not exist yet on a repo's very first
          # run -- only stage it if download_replay.py actually wrote it.
          if [ -f expired_replays.json ]; then
            git add expired_replays.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to index.json or expired_replays.json, nothing to commit."
            exit 0
          fi
          git commit -m "Update replay index [skip ci]"

          max_attempts=3
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Push attempt $attempt/$max_attempts..."
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected, rebasing onto latest main..."
            if git pull --rebase origin main; then
              echo "Rebase clean, retrying push..."
            else
              if git status --porcelain | grep -qE "^UU (index\.json|expired_replays\.json)"; then
                echo "Conflict on index.json/expired_replays.json, merging both versions..."
                python scripts/merge_index_conflict.py
                git add index.json
                if [ -f expired_replays.json ]; then
                  git add expired_replays.json
                fi
                GIT_EDITOR=true git rebase --continue
              else
                echo "Unexpected rebase conflict outside index.json/expired_replays.json, aborting."
                git rebase --abort
                exit 1
              fi
            fi

            attempt=$((attempt + 1))
          done

          echo "Failed to push after $max_attempts attempts."
          exit 1
